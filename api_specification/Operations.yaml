openapi: 3.0.0
info:
  title: CAB System - Operations API
  version: 1.0.0
  description: API cho nhân viên vận hành.
servers:
  - url: http://localhost:8080
paths:
  /api/admin/customers:
    get:
      summary: Quản lý/tra cứu khách hàng
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách khách hàng }
  /api/admin/drivers:
    get:
      summary: Quản lý/tra cứu tài xế
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách tài xế }
  /api/admin/vehicles:
    get:
      summary: Quản lý/tra cứu phương tiện
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách phương tiện }
  /api/admin/trips:
    get:
      summary: Xem các chuyến đang diễn ra
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách chuyến }
  /api/admin/trips/{tripId}/support:
    post:
      summary: Hỗ trợ xử lý chuyến bị lỗi
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Đã ghi nhận xử lý }
  /api/admin/transactions:
    get:
      summary: Tra cứu lịch sử giao dịch
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách giao dịch }
  /api/admin/reports:
    get:
      summary: Xem báo cáo hoạt động
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Báo cáo }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
