openapi: 3.0.0
info:
  title: CAB System - Notification API
  version: 1.0.0
  description: API quản lý thông báo cho khách hàng và tài xế.
servers:
  - url: http://localhost:8080
paths:
  /api/notifications:
    get:
      summary: Xem danh sách thông báo
      tags: [Notification]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách thông báo
  /api/notifications/{notificationId}/read:
    put:
      summary: Đánh dấu thông báo đã đọc
      tags: [Notification]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Đã cập nhật
  /api/internal/notifications:
    post:
      summary: Gửi thông báo qua nhà cung cấp thông báo
      tags: [Notification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Yêu cầu gửi được tiếp nhận
components:
  schemas:
    NotificationRequest:
      type: object
      required: [recipient, type, message]
      properties:
        recipient: { type: string }
        type: { type: string }
        message: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
