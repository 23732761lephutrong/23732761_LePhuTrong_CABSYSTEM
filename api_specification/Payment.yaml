openapi: 3.0.0
info:
  title: CAB System - Payment API
  version: 1.0.0
  description: API tính cước và thanh toán.
servers:
  - url: http://localhost:8080
paths:
  /api/trips/{tripId}/fare:
    get:
      summary: Xem số tiền phải trả
      tags: [Payment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Thông tin cước }
  /api/trips/{tripId}/payments:
    post:
      summary: Thanh toán
      tags: [Payment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201': { description: Thanh toán được ghi nhận }
        '402': { description: Thanh toán thất bại }
  /api/trips/{tripId}/payments/retry:
    post:
      summary: Xử lý lại thanh toán điện tử
      tags: [Payment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Yêu cầu xử lý lại được tiếp nhận }
  /api/payment-provider/callback:
    post:
      summary: Nhận kết quả từ nhà cung cấp thanh toán
      tags: [Payment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Đã nhận kết quả }
components:
  schemas:
    PaymentRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [CASH, ELECTRONIC]
        providerToken:
          type: string
          description: Token/tham chiếu do nhà cung cấp thanh toán cấp; CAB không lưu dữ liệu thẻ nhạy cảm.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
