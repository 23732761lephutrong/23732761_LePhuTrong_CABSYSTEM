openapi: 3.0.0
info:
  title: CAB System - Trip API
  version: 1.0.0
  description: API quản lý yêu cầu và trạng thái chuyến.
servers:
  - url: http://localhost:8080
paths:
  /api/trips:
    post:
      summary: Tạo yêu cầu đặt xe
      tags: [Trip]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201': { description: Chuyến được tạo }
  /api/trips/{tripId}:
    get:
      summary: Xem chi tiết chuyến
      tags: [Trip]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200': { description: Thông tin chuyến }
  /api/trips/{tripId}/driver-response:
    post:
      summary: Nhận phản hồi tài xế
      tags: [Trip]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [ACCEPT, REJECT]
      responses:
        '200': { description: Đã ghi nhận }
  /api/trips/{tripId}/status:
    put:
      summary: Cập nhật trạng thái chuyến
      tags: [Trip]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatus'
      responses:
        '200': { description: Cập nhật thành công }
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
  schemas:
    TripCreate:
      type: object
      required: [pickup, destination, vehicleTypeId]
      properties:
        pickup: { type: string }
        destination: { type: string }
        vehicleTypeId: { type: string }
    TripStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SEARCHING_DRIVER, DRIVER_ASSIGNED, ARRIVED, PICKED_UP, IN_PROGRESS, COMPLETED]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
