openapi: 3.0.0
info:
  title: CAB System - Customer API
  version: 1.0.0
  description: API cho chức năng tài khoản, đặt xe, theo dõi, lịch sử và đánh giá của khách hàng.
servers:
  - url: http://localhost:8080
paths:
  /api/customers/register:
    post:
      summary: Đăng ký tài khoản khách hàng
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/customers/login:
    post:
      summary: Đăng nhập
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
        '401':
          description: Xác thực thất bại
  /api/customers/me:
    put:
      summary: Cập nhật thông tin cá nhân
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Cập nhật thành công
        '401':
          description: Chưa xác thực
  /api/trips:
    post:
      summary: Tạo yêu cầu đặt xe
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Yêu cầu được tiếp nhận
        '400':
          description: Dữ liệu không hợp lệ
  /api/trips/{tripId}:
    get:
      summary: Xem chi tiết và trạng thái chuyến
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Thông tin chuyến
        '404':
          description: Không tìm thấy chuyến
  /api/customers/trips/history:
    get:
      summary: Xem lịch sử chuyến
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách lịch sử chuyến
  /api/trips/{tripId}/ratings:
    post:
      summary: Đánh giá tài xế
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá được lưu
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
  schemas:
    RegisterRequest:
      type: object
      required: [name, phone, email, password]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
    TripCreate:
      type: object
      required: [pickup, destination, vehicleTypeId]
      properties:
        pickup: { type: string }
        destination: { type: string }
        vehicleTypeId: { type: string }
    RatingRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
